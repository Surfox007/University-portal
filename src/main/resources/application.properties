# University Management System Application Configuration
server.port=8080

# Application Details
spring.application.name=university-portal

# Default Database Configuration: H2 In-Memory (for local standalone testing)
spring.datasource.url=jdbc:h2:mem:universitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=UniversityPortalSecretKeyCSE3230LabTask2026SpringSemesterEncryptionKey!
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.university.portal=INFO
logging.level.org.springframework.security=INFO
